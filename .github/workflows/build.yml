name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs Gradle itself, so no gradlew / wrapper files are needed in the repo.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate device list
        run: python3 tools/validate_catalog.py

      # Release signing is used only when the KEYSTORE_BASE64 secret exists.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          fi

      # Always builds the debug (testing) APK. The signed release APK is built too when the signing secrets exist.
      - name: Build APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TASKS="assembleDebug"
          if [ "$SIGNED" = "true" ]; then TASKS="$TASKS assembleRelease"; fi
          gradle $TASKS --stacktrace

      - name: Name the APKs with their version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/OnePlusOTA-v${VERSION}-debug.apk"
          if [ "$SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/*.apk "dist/OnePlusOTA-v${VERSION}.apk"
          else
            echo "::warning::Signing secrets not set, only the debug APK was built."
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -l dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OnePlusOTA-v${{ env.VERSION }}
          path: dist/*.apk

      # Pushing a tag like v1.0.0 publishes a GitHub Release with the APK attached.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: OnePlus OTA ${{ github.ref_name }}
          generate_release_notes: true
