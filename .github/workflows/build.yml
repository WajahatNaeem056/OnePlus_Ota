name: Build debug APK

# Runs on every push. Builds the testing (debug) APK, no secrets needed.
on:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs Gradle itself, so no gradlew / wrapper files are needed in the repo.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate device list
        run: python3 tools/validate_catalog.py

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Name the APK with its version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/OnePlusOTA-v${VERSION}-debug.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OnePlusOTA-v${{ env.VERSION }}-debug
          path: dist/*.apk
